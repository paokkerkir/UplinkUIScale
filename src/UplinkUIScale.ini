; UplinkUIScale - UI scaling for Uplink at high resolutions
; The UI is laid out as if the screen were ~1024x768 and then scaled up to
; your real resolution, so it keeps the size and proportions of 1024x768.

[General]
; 0 = mod does nothing (game runs as without it)
Enabled=1
; 1 = write UplinkUIScale.log next to the dll
Log=0

[Display]
; Output resolution. 0 = desktop resolution of the primary monitor.
; The in-game resolution list will only show the matching "logical" size;
; change the real resolution here instead.
Width=0
Height=0
; auto       = follow the game's fullscreen option
; fullscreen = exclusive fullscreen
; windowed   = window (largest that fits the desktop unless Width/Height set)
; borderless = borderless window covering the whole screen
Mode=borderless
; Keep Windows from blurring the game when display scaling is above 100%
DPIAware=1

[Scale]
; 0 = automatic: min(Width / BaseWidth, Height / BaseHeight)
;     e.g. 1920x1080 -> 1.406, 2560x1440 -> 1.875, 3840x2160 -> 2.813
; Any other value forces that scale (e.g. 2.0)
; The scale is capped so the game always gets at least 800x600 to lay out in
Scale=0
; Multiplies the automatic scale. 0.85 = smaller UI / more room, 1.15 = bigger
Multiplier=1.0
; 1 = round the scale down to a whole number for pixel-perfect output
;     (may leave black borders)
IntegerScale=0
; Reference layout the automatic scale is based on
BaseWidth=1024
BaseHeight=768

[Rendering]
; How text glyphs are enlarged:
;   auto   = sharp at whole-number scales, smooth otherwise
;   smooth = anti-aliased, rounded edges (best at fractional scales)
;   sharp  = blocky pixel-perfect (best at 2x, 3x, ...)
;   linear = plain bilinear (soft / blurry)
TextFilter=auto
; Extra weight for "smooth" text, 0.0 - 0.4 (higher = bolder)
TextBoldness=0.05
; How images are enlarged: auto, sharp or linear
ImageFilter=auto
; Multiplier on top of the UI scale for line thickness
LineScale=1.0

[Cursor]
; 1 = draw a mouse cursor that scales with the UI
; 0 = keep the normal (small) system cursor
ScaleCursor=1
; Multiplier for the cursor size
CursorSize=1.0
